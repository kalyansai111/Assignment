version: 2

models:
  - name: stg_table_a
    columns:
      - name: name
        tests: [not_null]
      - name: age
        tests: [not_null]
      - name: city
        tests: [not_null]

  - name: table_b
    columns:
      - name: name
        tests: [not_null]
      - name: age
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: category
        tests: [not_null]
    tests:
      - unique:
          column_name: "(name || '|' || age::text || '|' || city)"
